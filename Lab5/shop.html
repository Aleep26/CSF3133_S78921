<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Bookstore</title>
  
  <!-- Google Fonts: Roboto and Merriweather -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;family=Merriweather:wght@400;700&amp;display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="shop.css">
</head>
<body>

Error 5  (shop.css, Line 2):   font name misspelt 'Robotto'; must be 'Roboto'.
Error 6  (shop.css, Line 4):   "no repeat" must be "no-repeat" (hyphen), so the image repeated.
Error 7  (shop.css, Line 5):   property misspelt "bacground-position"; must be background-position.
Error 8  (shop.css, Line 18):  display: inline ignores the padding of links; must be display: block.
Error 9  (shop.css, Line 23):  selector li:a:hover is invalid; must be li a:hover.

  <!-- Header with background image -->
  <header>
    <h1>Campus Bookstore</h1>
    <p>Textbooks, stationery and more for every student.</p>
  </header>

  <!-- Horizontal Navigation Bar -->
  <nav>
    <ul>
      <li><a class="active" href="#home">Home</a></li>
      <li><a href="#books">Books</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <main id="books">
    <table id="products">
      <tr>
        <th>Item</th>
        <th>Category</th>
        <th>Price (RM)</th>
      </tr>
      <tr>
        <td>Web Design Basics</td>
        <td>Textbook</td>
        <td>45.00</td>
      </tr>
      <tr>
        <td>A4 Notebook</td>
        <td>Stationery</td>
        <td>6.50</td>
      </tr>
      <tr>
        <td>USB Drive 32GB</td>
        <td>Gadget</td>
        <td>25.00</td>
      </tr>
      <tr>
        <td>Highlighter Set</td>
        <td>Stationery</td>
        <td>9.90</td>
      </tr>
    </table>
  </main>

  <!-- Footer -->
  <footer id="contact">
    <p>&copy; 2026 Campus Bookstore</p>
  </footer>

</body>
</html>
